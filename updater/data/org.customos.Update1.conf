<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  CustomOS update service. Everyone may read the status and history;
  administrators (root and the "wheel" group) may check, download, install,
  restart and roll back. customos-updated checks the caller again itself.
-->
<busconfig>
  <policy user="root">
    <allow own="org.customos.Update1"/>
    <allow send_destination="org.customos.Update1"/>
  </policy>

  <policy group="wheel">
    <allow send_destination="org.customos.Update1"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.customos.Update1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.customos.Update1"
           send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="org.customos.Update1"
           send_interface="org.customos.Update1" send_member="GetStatus"/>
    <allow send_destination="org.customos.Update1"
           send_interface="org.customos.Update1" send_member="GetHistory"/>
  </policy>

  <!--
    RAUC's stock policy lets any user control it, which would let an
    unprivileged user install an older (validly signed) bundle or mark slots
    bad behind the update service's back. On CustomOS only root talks to
    RAUC's installer interface; reading its properties stays open.
  -->
  <policy context="default">
    <deny send_destination="de.pengutronix.rauc"
          send_interface="de.pengutronix.rauc.Installer"/>
    <allow send_destination="de.pengutronix.rauc"
           send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="de.pengutronix.rauc"
           send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>
    <allow send_destination="de.pengutronix.rauc"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
  <policy user="root">
    <allow send_destination="de.pengutronix.rauc"/>
  </policy>
</busconfig>
