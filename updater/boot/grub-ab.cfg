# CustomOS A/B boot menu. customos-install-ab copies this file to
# <EFI system partition>/grub/grub.cfg; BIOS and UEFI boots both use it.
# Over-the-air updates never change it: they only rewrite the inactive slot
# and the variables in grubenv (next to this file), which RAUC shares:
#
#   ORDER="A B"  slots by priority; an update puts its slot first
#   X_OK=1       slot X holds a usable system (RAUC sets 0 when marking it bad)
#   X_TRY=n      boots of slot X since it was last confirmed; GRUB counts up,
#                customos-health-check confirms a boot with "rauc status
#                mark-good", which resets it to 0
#   X_VERSION    version installed in slot X (for this menu)
#
# A slot is started at most three times without being confirmed. After that
# the next slot in ORDER starts instead: that is the automatic rollback when
# an update does not boot (kernel panic, hang with a watchdog, failed health
# check).
#
# Each slot can add kernel arguments in its own /boot/customos/cmdline.cfg,
# so new versions can change them without touching this file.

set timeout=3
set timeout_style=menu
set menu_color_normal=light-gray/black
set menu_color_highlight=black/cyan

insmod part_gpt
insmod fat
insmod squash4
insmod xzio
insmod gzio
insmod loadenv
insmod regexp
insmod probe
insmod test
insmod linux
if [ "${grub_platform}" = "efi" ]; then
    insmod efi_gop
fi
# Also show the menu on the first serial port when there is one (virtual
# machines, servers); the screen stays the main console.
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

set envfile="${prefix}/grubenv"
set ORDER="A B"
set A_OK=0
set A_TRY=0
set B_OK=0
set B_TRY=0
set A_VERSION=""
set B_VERSION=""
load_env --file "${envfile}" ORDER A_OK A_TRY B_OK B_TRY A_VERSION B_VERSION

# The disk this partition belongs to: prefix is "(hd0,gpt2)/grub".
set bootdisk=""
regexp --set=1:bootdisk '^\(([^,)]+)' "${prefix}"
if [ -z "${bootdisk}" ]; then
    regexp --set=1:bootdisk '^([^,]+)' "${root}"
fi

# ---- choose the slot ------------------------------------------------------------------
set boot_slot=""
for SLOT in ${ORDER}; do
    if [ -z "${boot_slot}" ]; then
        if [ "${SLOT}" = "A" -a "${A_OK}" = "1" ]; then
            if [ "${A_TRY}" = "0" ]; then
                set A_TRY=1
                set boot_slot=A
            elif [ "${A_TRY}" = "1" ]; then
                set A_TRY=2
                set boot_slot=A
            elif [ "${A_TRY}" = "2" ]; then
                set A_TRY=3
                set boot_slot=A
            fi
        fi
        if [ "${SLOT}" = "B" -a "${B_OK}" = "1" ]; then
            if [ "${B_TRY}" = "0" ]; then
                set B_TRY=1
                set boot_slot=B
            elif [ "${B_TRY}" = "1" ]; then
                set B_TRY=2
                set boot_slot=B
            elif [ "${B_TRY}" = "2" ]; then
                set B_TRY=3
                set boot_slot=B
            fi
        fi
    fi
done

if [ -z "${boot_slot}" ]; then
    # No slot has tries left. Start the first usable one anyway (rather than
    # nothing) and give the person time to pick another.
    set timeout=15
    for SLOT in ${ORDER}; do
        if [ -z "${boot_slot}" ]; then
            if [ "${SLOT}" = "A" -a "${A_OK}" = "1" ]; then set boot_slot=A; fi
            if [ "${SLOT}" = "B" -a "${B_OK}" = "1" ]; then set boot_slot=B; fi
        fi
    done
    if [ -z "${boot_slot}" ]; then set boot_slot=A; fi
    echo "CustomOS: no confirmed system slot left; defaulting to slot ${boot_slot}."
fi

save_env --file "${envfile}" A_TRY B_TRY

if [ "${boot_slot}" = "A" ]; then
    set other_slot=B
    set current_version="${A_VERSION}"
    set previous_version="${B_VERSION}"
    set previous_ok="${B_OK}"
else
    set other_slot=A
    set current_version="${B_VERSION}"
    set previous_version="${A_VERSION}"
    set previous_ok="${A_OK}"
fi

# customos_boot SLOT [EXTRA KERNEL ARGUMENTS]
function customos_boot {
    if [ "$1" = "A" ]; then set slotpart=gpt3; else set slotpart=gpt4; fi
    set slotdev="(${bootdisk},${slotpart})"
    probe --set=slotuuid --part-uuid "${slotdev}"
    probe --set=datauuid --part-uuid "(${bootdisk},gpt5)"
    set slot_cmdline="quiet loglevel=3 vt.global_cursor_default=0"
    if [ -f "${slotdev}/boot/customos/cmdline.cfg" ]; then
        source "${slotdev}/boot/customos/cmdline.cfg"
    fi
    echo "Loading CustomOS (slot $1)..."
    # (GRUB has no line continuation: keep this on one line.)
    linux "${slotdev}/boot/bzImage" root=PARTUUID=${slotuuid} rootfstype=squashfs ro rootwait init=/usr/lib/customos/customos-preinit rauc.slot=$1 customos.data=PARTUUID=${datauuid} panic=10 ${slot_cmdline} $2 $3 $4
}

menuentry "CustomOS ${current_version}" --id normal {
    customos_boot "${boot_slot}"
}
menuentry "CustomOS ${current_version} (safe graphics)" --id safe {
    customos_boot "${boot_slot}" nomodeset meridian.software=1
}
menuentry "CustomOS ${current_version} (text console)" --id text {
    customos_boot "${boot_slot}" systemd.unit=multi-user.target
}
if [ "${previous_ok}" = "1" ]; then
    menuentry "Previous version: CustomOS ${previous_version} (slot ${other_slot})" --id previous {
        customos_boot "${other_slot}"
    }
fi
if [ "${grub_platform}" = "efi" ]; then
    menuentry "UEFI firmware settings" --id fwsetup {
        fwsetup
    }
fi
menuentry "Reboot" --id reboot {
    reboot
}
menuentry "Power off" --id poweroff {
    halt
}

set default=normal
