# RAUC configuration of an installed CustomOS A/B system. customos-preinit
# fills in the slot devices of the disk the system booted from and writes the
# result to /run/rauc/system.conf at every boot.

[system]
compatible=@COMPATIBLE@
bootloader=grub
grubenv=/efi/grub/grubenv
# Slot status and bundle history on the persistent data partition.
data-directory=/data/rauc
# Only dm-verity bundles: every block is authenticated when it is read, so a
# bundle cannot be swapped after its signature was checked.
bundle-formats=-plain

[keyring]
path=/etc/rauc/keyring.pem
# The signing certificate must carry extendedKeyUsage=codeSigning.
check-purpose=codesign

[handlers]
pre-install=/usr/lib/customos/customos-rauc-pre-install
post-install=/usr/lib/customos/customos-rauc-post-install

[slot.rootfs.0]
device=@SLOT_A_DEVICE@
type=raw
bootname=A

[slot.rootfs.1]
device=@SLOT_B_DEVICE@
type=raw
bootname=B
