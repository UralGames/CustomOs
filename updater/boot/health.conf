# customos-health-check: what must work before an updated system is kept.
#
# The first boot of a newly installed version is a trial. If any unit below is
# not running after TRIAL_TIMEOUT seconds, or stops within SETTLE seconds of
# starting, the new version is marked bad and the computer restarts into the
# previous version. Boots of an already confirmed version are confirmed as
# soon as the system is up (a later problem is not solved by going back).

REQUIRED_UNITS="dbus.service rauc.service customos-updated.service meridian-login.service"
TRIAL_TIMEOUT=240
SETTLE=20
