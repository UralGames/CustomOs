
# Build the bootable live/installer ISO, CustomOS-x86_64.iso.
# Base edition: customos_x86_64_defconfig.
# No OTA signing keys are required.
#
# Manual build:
# Actions > Build ISO > Run workflow
#
# The completed ISO and SHA256 checksum are uploaded as artifacts.
#
# The first build may require several hours.
# Up to three build jobs are supported.
#
# Download and compiler caches are reused where possible.

name: Build ISO

on:
  workflow_dispatch:
    inputs:
      retention_days:
        description: Days to keep the ISO artifact
        type: number
        required: false
        default: 7

  push:
    paths:
      - build.sh
      - br2-external/Config.in
      - br2-external/external.*
      - br2-external/configs/customos_x86_64_defconfig
      - br2-external/package/**
      - br2-external/board/customos/linux.fragment
      - .github/workflows/build-iso.yml
      - .github/workflows/build-iso-attempt.yml

permissions:
  contents: read

concurrency:
  group: build-iso-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  sources:
    name: Download and check all sources

    runs-on: ${{ vars.CUSTOMOS_BUILD_RUNNER || 'ubuntu-24.04' }}

    timeout-minutes: 90

    env:
      BR2_DL_DIR: ${{ github.workspace }}/dl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            build-essential \
            bc \
            cpio \
            file \
            git \
            libncurses-dev \
            perl \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            bzip2 \
            zstd

          mkdir -p "$BR2_DL_DIR"

      - name: Restore source downloads
        id: dl
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: buildroot-dl-iso-${{ hashFiles('build.sh', 'br2-external/configs/customos_x86_64_defconfig', 'br2-external/package/**') }}
          restore-keys: |
            buildroot-dl-iso-

      - name: Download all sources
        run: |
          ./build.sh --source

      - name: Check downloaded sources
        shell: bash
        run: |
          {
            echo "### CustomOS Sources"
            echo
            echo "All sources downloaded."
            echo
            echo "Total download size:"
            du -sh "$BR2_DL_DIR"
          } >> "$GITHUB_STEP_SUMMARY"

          missing=""

          for dir in br2-external/package/*/; do
            pkg=$(basename "$dir")

            if ls "$dir"*.hash >/dev/null 2>&1; then
              continue
            fi

            if [ ! -d "$BR2_DL_DIR/$pkg" ]; then
              continue
            fi

            missing+="# br2-external/package/$pkg/$pkg.hash"$'\n'
            missing+="# Locally calculated"$'\n'

            for f in "$BR2_DL_DIR/$pkg"/*; do
              if [ -f "$f" ]; then
                hash=$(sha256sum "$f" | cut -d' ' -f1)
                filename=$(basename "$f")
                missing+="sha256  $hash  $filename"$'\n'
              fi
            done

            missing+=$'\n'
          done

          if [ -n "$missing" ]; then
            printf '%s' "$missing"

            {
              echo
              echo "### Missing package hash files"
              echo
              echo '```'
              printf '%s' "$missing"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save source downloads
        if: steps.dl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dl
          key: ${{ steps.dl.outputs.cache-primary-key }}

  build-1:
    name: Build (job 1)

    needs: sources

    if: github.event_name == 'workflow_dispatch'

    uses: ./.github/workflows/build-iso-attempt.yml

    with:
      attempt: 1
      last: false
      retention_days: 7

  build-2:
    name: Build (job 2, continues job 1)

    needs: build-1

    if: needs.build-1.outputs.result == 'timeout'

    uses: ./.github/workflows/build-iso-attempt.yml

    with:
      attempt: 2
      last: false
      retention_days: 7

  build-3:
    name: Build (job 3, continues job 2)

    needs: build-2

    if: needs.build-2.outputs.result == 'timeout'

    uses: ./.github/workflows/build-iso-attempt.yml

    with:
      attempt: 3
      last: true
      retention_days: 7
