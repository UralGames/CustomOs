# Build the OTA edition, sign the update bundle and publish a GitHub release.
#
# Runs when a tag vX.Y.Z is pushed (the tag must equal the VERSION file), or by
# hand from the Actions tab. Needs (see docs/SIGNING.md):
#   keys/customos-ota-ca.cert.pem      committed public CA certificate
#   secret CUSTOMOS_SIGNING_CERT       release signing certificate (PEM)
#   secret CUSTOMOS_SIGNING_KEY        release signing key (PEM)
# Optional repository variables:
#   CUSTOMOS_BUILD_RUNNER   runner label (default ubuntu-24.04). A full build
#                           with Qt, Mesa and LLVM takes several hours; a
#                           self-hosted or larger runner is recommended.
#   CUSTOMOS_BUILD_TIMEOUT  job timeout in minutes (default 360, the maximum
#                           for GitHub-hosted runners)
#   CUSTOMOS_RELEASE_REPO   OWNER/NAME of a public repository to publish the
#                           releases in (with secret CUSTOMOS_RELEASE_TOKEN)
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release (otherwise the files are kept as workflow artifacts only)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ vars.CUSTOMOS_BUILD_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: ${{ fromJSON(vars.CUSTOMOS_BUILD_TIMEOUT || '360') }}
    env:
      BR2_DL_DIR: ${{ github.workspace }}/dl
      CUSTOMOS_BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version and the signing setup
        env:
          CUSTOMOS_SIGNING_CERT: ${{ secrets.CUSTOMOS_SIGNING_CERT }}
          CUSTOMOS_SIGNING_KEY: ${{ secrets.CUSTOMOS_SIGNING_KEY }}
        run: |
          version=$(tr -d ' \n' < VERSION)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($version)"; exit 1
          fi
          grep -q "^## $version" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          test -s keys/customos-ota-ca.cert.pem || { echo "::error::keys/customos-ota-ca.cert.pem is missing (docs/SIGNING.md)"; exit 1; }
          test -n "$CUSTOMOS_SIGNING_CERT" && test -n "$CUSTOMOS_SIGNING_KEY" \
            || { echo "::error::Secrets CUSTOMOS_SIGNING_CERT and CUSTOMOS_SIGNING_KEY are not set (docs/SIGNING.md)"; exit 1; }
          printf '%s\n' "$CUSTOMOS_SIGNING_CERT" | openssl verify -CAfile keys/customos-ota-ca.cert.pem \
            || { echo "::error::The signing certificate is not issued by keys/customos-ota-ca.cert.pem"; exit 1; }

      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h .

      - name: Host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential bc cpio file git libncurses-dev \
            perl python3 rsync unzip wget xz-utils bzip2 zstd

      - name: Source downloads cache
        uses: actions/cache@v4
        with:
          path: dl
          key: buildroot-dl-${{ hashFiles('build.sh', 'br2-external/configs/*', 'br2-external/package/**/*.mk') }}
          restore-keys: buildroot-dl-

      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.buildroot-ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      - name: Build CustomOS (OTA edition)
        run: ./build.sh --ota

      - name: Sign the update bundle and write the release files
        env:
          CUSTOMOS_SIGNING_CERT: ${{ secrets.CUSTOMOS_SIGNING_CERT }}
          CUSTOMOS_SIGNING_KEY: ${{ secrets.CUSTOMOS_SIGNING_KEY }}
        run: release/make-release.sh output-ota/images

      - name: Keep the release files
        uses: actions/upload-artifact@v4
        with:
          name: customos-release
          path: release/out/
          retention-days: 14

      # Releases go to this repository, or to the public repository named by
      # the variable CUSTOMOS_RELEASE_REPO (needed while this one is private;
      # docs/RELEASING.md). That needs the secret CUSTOMOS_RELEASE_TOKEN: a
      # fine-grained token with "Contents: read and write" on it.
      - name: Publish the GitHub release
        if: github.ref_type == 'tag' || inputs.publish
        env:
          GITHUB_TOKEN: ${{ vars.CUSTOMOS_RELEASE_REPO && secrets.CUSTOMOS_RELEASE_TOKEN || github.token }}
          RELEASE_REPO: ${{ vars.CUSTOMOS_RELEASE_REPO || github.repository }}
        run: |
          target=()
          # The tag of a release in another repository points at its default branch.
          [ "$RELEASE_REPO" != "$GITHUB_REPOSITORY" ] && target=(--target "")
          release/publish-github-release.sh "release/out/v$(tr -d ' \n' < VERSION)" --repo "$RELEASE_REPO" "${target[@]}"
