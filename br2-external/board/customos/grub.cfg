# CustomOS live ISO boot menu (used for both BIOS and UEFI boots).
# __KERNEL_PATH__ and __INITRD_PATH__ are filled in by Buildroot.
set default=0
set timeout=5
set timeout_style=menu
set menu_color_normal=light-gray/black
set menu_color_highlight=black/cyan
set color_normal=light-gray/black

menuentry "Start CustomOS (live)" --id live {
    echo "Loading CustomOS..."
    linux __KERNEL_PATH__ quiet loglevel=3 rd.udev.log_level=3 systemd.show_status=auto vt.global_cursor_default=0
    initrd __INITRD_PATH__
}

menuentry "Start CustomOS (safe graphics)" --id safe {
    echo "Loading CustomOS (safe graphics)..."
    linux __KERNEL_PATH__ quiet loglevel=3 nomodeset meridian.software=1
    initrd __INITRD_PATH__
}

menuentry "Start CustomOS (text console only)" --id text {
    echo "Loading CustomOS (text console)..."
    linux __KERNEL_PATH__ loglevel=4 systemd.unit=multi-user.target
    initrd __INITRD_PATH__
}

menuentry "Reboot" --id reboot {
    reboot
}

menuentry "Power off" --id poweroff {
    halt
}
