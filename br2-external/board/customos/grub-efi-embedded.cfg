# Embedded into the UEFI GRUB image of the live ISO. The EFI image lives on
# a small FAT image inside the ISO, so point GRUB at the ISO file system and
# load the shared boot menu from /boot/grub/grub.cfg there.
if [ -e (cd0)/boot/grub/grub.cfg ]; then
    set root=(cd0)
else
    search --no-floppy --set=root --file /boot/grub/grub.cfg
fi
set prefix=($root)/boot/grub
configfile ($root)/boot/grub/grub.cfg
