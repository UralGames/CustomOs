# foot terminal defaults for the Meridian desktop (system-wide).
# Users can override anything in ~/.config/foot/foot.ini.

font=JetBrains Mono:size=11
pad=10x8
term=foot

[csd]
# Let the compositor draw the title bar so terminals match other windows.
preferred=server

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

[colors]
alpha=0.97
background=161b1b
foreground=dfe5e3
regular0=1e2525
regular1=e06c62
regular2=7ec699
regular3=e5c07b
regular4=6fa8dc
regular5=c792b9
regular6=5bc7b4
regular7=c8d0ce
bright0=4a5555
bright1=f08a80
bright2=99dbb2
bright3=f0d398
bright4=8fbde8
bright5=d9aacd
bright6=7fdac9
bright7=f2f5f4
selection-background=2e4a46
selection-foreground=f2f5f4
